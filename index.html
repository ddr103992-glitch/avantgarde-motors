async function cloudWrite(raw){if(!cloudAvailable()||!cloudReady)return;const chunks=raw.match(/[\s\S]{1,3300}/g)||[raw];if(chunks.length>20)return;for(let i=0;i<chunks.length;i++){const ok=await tgCall('setItem',SK+'_p'+i,chunks[i]);if(ok===null)return;}await tgCall('setItem',SK+'_parts',String(chunks.length));lastCloudPush=Date.now();}
function scheduleCloudSave(){if(!cloudAvailable()||!cloudReady)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudWrite(JSON.stringify(state)),1400)}
function addTelegramStatus(){if(!TGID)return;const main=$('main');if(!main||document.getElementById('tgAccountStatus'))return;const d=document.createElement('div');d.id='tgAccountStatus';d.className='tg-account';const name=[TGUSER?.first_name,TGUSER?.last_name].filter(Boolean).join(' ')||'Telegram';d.innerHTML=`<span>◉</span><span>Аккаунт <b>${name.replace(/[&<>"']/g,'')}</b><br><span class="tg-status">Профиль привязан к Telegram · облачное сохранение ${cloudAvailable()?'доступно':'недоступно'}</span></span>`;main.insertBefore(d,main.firstChild)}
function save(r=true){state.savedAt=Date.now();const data=JSON.stringify(state);try{localStorage.setItem(SK,data)}catch(e){try{sessionStorage.setItem(SK,data)}catch(e2){toast("Не удалось сохранить: проверь доступность хранилища браузера")}}head();scheduleCloudSave();if(r)render()}
function toggleFullscreen(){const el=document.documentElement;try{if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);toast('Полноэкранный режим')}else{(document.exitFullscreen||document.webkitExitFullscreen)?.call(document);}}catch(e){toast('Полный экран недоступен в этом браузере')}}
document.addEventListener('fullscreenchange',()=>{const b=$('#fullscreenToggle');if(b)b.textContent=document.fullscreenElement?'⤢':'⛶'});
window.addEventListener('pagehide',()=>{const raw=JSON.stringify(state);try{localStorage.setItem(SK,raw)}catch(e){try{sessionStorage.setItem(SK,raw)}catch(e2){}}if(cloudAvailable()&&cloudReady)cloudWrite(raw)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){const raw=JSON.stringify(state);try{localStorage.setItem(SK,raw)}catch(e){try{sessionStorage.setItem(SK,raw)}catch(e2){}}if(cloudAvailable()&&cloudReady)cloudWrite(raw)}});

let mv=null,mt=0;function cnt(v){const e=$("#money");if(mv===null){mv=v;e.textContent=fmt(v);return}const a=mv,t0=performance.now();cancelAnimationFrame(mt);const f=n=>{const k=Math.min(1,(n-t0)/600);mv=a+(v-a)*k;e.textContent=fmt(mv);if(k<1)mt=requestAnimationFrame(f)};mt=requestAnimationFrame(f)}

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),2800)}

function drawTune(){

 panel.innerHTML=`<div class="tune-preview"><div class="stage" style="--rc:${o.tune.paint||c.col}">${art(c,o)}</div><div class="tune-meta"><span>${o.tune.paint?"CUSTOM PAINT":"FACTORY PAINT"}</span><b>${o.tune.engine+o.tune.turbo+o.tune.suspension+o.tune.nitro?"STAGE "+(o.tune.engine+o.tune.turbo+o.tune.suspension+o.tune.nitro)+" BUILD":"STOCK BUILD"}</b></div></div><div class="stats"><div class="stat"><b>${hp}</b><span>Л.С. СЕЙЧАС</span></div><div class="stat"><b>+${o.tune.turbo*15+o.tune.nitro*12}%</b><span>БОНУС ЗАЕЗДА</span></div><div class="stat"><b>${o.tune.engine+o.tune.turbo+o.tune.suspension+o.tune.nitro}/14</b><span>УРОВЕНЬ СБОРКИ</span></div></div>

function upgradePart(uid,key){
 const o=state.owned.find(x=>x.uid===uid),p=PARTS.find(x=>x.k===key);if(!o||!p)return;
 o.tune=o.tune||{engine:0,turbo:0,suspension:0,nitro:0,paint:""};
 const lv=o.tune[key]||0,cost=Math.round(p.base*Math.pow(p.step,lv));if(lv>=p.max)return toast("Улучшение максимальное");if(state.money<cost)return toast("Не хватает средств");
 state.money-=cost;o.tune[key]=lv+1;state.xp+=20;toast(p.n+" улучшен до Stage "+(lv+1));sfx("upgrade");burst(key==="nitro"?"#5ee6ff":"#f5c46b",16);save(false);drawTune();head();
}
function paintCar(uid,col){
 const o=state.owned.find(x=>x.uid===uid);if(!o)return;if((o.tune?.paint||"")===col)return toast("Этот цвет уже установлен");
 if(state.money<4000)return toast("Нужно 4 000 ₽");state.money-=4000;o.tune=o.tune||{};o.tune.paint=col;save(false);drawTune();head();sfx("paint");burst(col||byId(o.id).col,14);toast("Новый цвет нанесён");
}

 const code=input.value.trim().toUpperCase().replace(/\s+/g,"");if(!code)return toast("Введи промокод");

 const promo=PROMO_CODES[code];if(!promo){sfx("fail");return toast("Промокод не найден");}
